# Discord gateway process. No inbound HTTP: it holds an outbound websocket, so
# it has no services block and must stay running.
#
# Scaling this past one machine requires Discord gateway sharding. Until then,
# exactly one machine, and a restart is a brief outage by design.
app = "hifi-bot"
primary_region = "iad"

[build]
  dockerfile = "../../deploy/Dockerfile"
  [build.args]
    APP = "bot"

[env]
  NODE_ENV = "production"
  HIFI_SERVICE = "bot"

[deploy]
  strategy = "immediate"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
